name: Build & Deploy Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: TrelifeDriveSetup
          path: dist/*.exe
          retention-days: 90

      - name: Deploy to server
        if: success()
        shell: pwsh
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Write SSH key
          $keyFile = "$env:RUNNER_TEMP\deploy_key"
          [System.IO.File]::WriteAllText($keyFile, $env:DEPLOY_KEY)
          icacls $keyFile /inheritance:r /grant:r "${env:USERNAME}:F" | Out-Null

          # Find built exe
          $exe = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          if (-not $exe) { Write-Error "No .exe found in dist/"; exit 1 }
          $name = [System.IO.Path]::GetFileName($exe)
          Write-Host "Deploying: $name"

          # Ensure target directory exists
          ssh -o StrictHostKeyChecking=no -i $keyFile `
            "${env:DEPLOY_USER}@${env:DEPLOY_HOST}" `
            "mkdir -p /opt/treelife-drive/public/installers"

          # SCP the installer
          scp -o StrictHostKeyChecking=no -i $keyFile `
            $exe `
            "${env:DEPLOY_USER}@${env:DEPLOY_HOST}:/opt/treelife-drive/public/installers/$name"

          # Activate as the live installer
          ssh -o StrictHostKeyChecking=no -i $keyFile `
            "${env:DEPLOY_USER}@${env:DEPLOY_HOST}" `
            "cp /opt/treelife-drive/public/installers/$name /opt/treelife-drive/public/TrelifeDriveSetup.exe && rm -f /opt/treelife-drive/public/TrelifeDriveSetup.exe.placeholder && ls -lh /opt/treelife-drive/public/TrelifeDriveSetup.exe"

          # Cleanup key
          Remove-Item $keyFile -ErrorAction SilentlyContinue
          Write-Host "Deploy complete"
