name: Build & Deploy Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find installer and compute checksum
        id: info
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\*.exe | Select-Object -First 1)
          if (-not $exe) { Write-Error "No .exe found"; exit 1 }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $size = [math]::Round($exe.Length / 1MB, 1)
          echo "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
          echo "size=${size}MB" >> $env:GITHUB_OUTPUT
          Write-Host "Built: $($exe.Name) ($size MB)"
          Write-Host "SHA256: $hash"

      - name: Write checksum file
        shell: pwsh
        run: |
          $hash = "${{ steps.info.outputs.sha256 }}"
          $name = "${{ steps.info.outputs.name }}"
          "$hash  $name" | Out-File -FilePath dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Upload build artifact (90-day backup)
        uses: actions/upload-artifact@v4
        with:
          name: TrelifeDriveSetup
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Treelife Drive - Build ${{ github.run_number }}"
          body: |
            Treelife Drive Windows installer

            SHA256: ${{ steps.info.outputs.sha256 }}
            Size: ${{ steps.info.outputs.size }}

            To verify in PowerShell: Get-FileHash TrelifeDriveSetup.exe -Algorithm SHA256

            Install: Run the installer and sign in with your Treelife Google account.
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          make_latest: true

      - name: Deploy exe to server
        if: success()
        shell: pwsh
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          EXE_NAME: ${{ steps.info.outputs.name }}
          EXE_SHA256: ${{ steps.info.outputs.sha256 }}
          EXE_SIZE: ${{ steps.info.outputs.size }}
        run: |
          $keyFile = "$env:RUNNER_TEMP\deploy_key"
          [System.IO.File]::WriteAllText($keyFile, $env:DEPLOY_KEY)
          icacls $keyFile /inheritance:r /grant:r "${env:USERNAME}:F" | Out-Null

          $exe = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          $remote = "$($env:DEPLOY_USER)@$($env:DEPLOY_HOST)"

          $meta = '{"name":"' + $env:EXE_NAME + '","sha256":"' + $env:EXE_SHA256 + '","size":"' + $env:EXE_SIZE + '","build":' + $env:GITHUB_RUN_NUMBER + '}'
          $metaFile = "$env:RUNNER_TEMP\installer-meta.json"
          [System.IO.File]::WriteAllText($metaFile, $meta)

          ssh -o StrictHostKeyChecking=no -i $keyFile $remote "mkdir -p /opt/treelife-drive/public/installers"
          scp -o StrictHostKeyChecking=no -i $keyFile $exe "$remote:/opt/treelife-drive/public/installers/$($env:EXE_NAME)"
          scp -o StrictHostKeyChecking=no -i $keyFile dist\SHA256SUMS.txt "$remote:/opt/treelife-drive/public/installers/SHA256SUMS.txt"
          scp -o StrictHostKeyChecking=no -i $keyFile $metaFile "$remote:/opt/treelife-drive/public/installer-meta.json"
          ssh -o StrictHostKeyChecking=no -i $keyFile $remote "cp /opt/treelife-drive/public/installers/$($env:EXE_NAME) /opt/treelife-drive/public/TrelifeDriveSetup.exe && ls -lh /opt/treelife-drive/public/TrelifeDriveSetup.exe"

          Remove-Item $keyFile -ErrorAction SilentlyContinue
          Write-Host "Deployed successfully"
